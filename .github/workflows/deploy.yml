name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  staging:
    if: github.event_name == 'push'
    uses: Marketplace-Studio-Dev/ci-templates/.github/workflows/deploy-cloudflare.yml@9dd15a68db62af1d8a5bf4220e2347dbc2349420
    with:
      environment: staging
      node_version: '22'
      package_manager: pnpm
      setup_command: 'test -z "${CLOUDFLARE_API_TOKEN:-}" && echo "setup: no secrets, as expected"'
      migrate_command: 'test -n "$CLOUDFLARE_API_TOKEN" && echo "migrate staging: secrets present, as expected"'
      deploy_command: 'test -n "$CLOUDFLARE_API_TOKEN" && echo "deploy staging: secrets present, as expected"'
      smoke_command: 'test -z "${CLOUDFLARE_API_TOKEN:-}" && echo "smoke staging: no secrets, as expected"'
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    if: github.event_name == 'workflow_dispatch'
    uses: Marketplace-Studio-Dev/ci-templates/.github/workflows/deploy-cloudflare.yml@9dd15a68db62af1d8a5bf4220e2347dbc2349420
    with:
      environment: production
      node_version: '22'
      package_manager: pnpm
      setup_command: 'test -z "${CLOUDFLARE_API_TOKEN:-}" && echo "setup: no secrets, as expected"'
      migrate_command: 'test -n "$CLOUDFLARE_API_TOKEN" && echo "migrate production: secrets present, as expected"'
      deploy_command: 'test -n "$CLOUDFLARE_API_TOKEN" && echo "deploy production: secrets present, as expected"'
      smoke_command: 'test -z "${CLOUDFLARE_API_TOKEN:-}" && echo "smoke production: no secrets, as expected"'
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
